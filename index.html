<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影之刃零攻略站 · Workers 全栈 Demo</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.5rem; } h1 small { color: #888; font-weight: normal; font-size: .8rem; }
  .card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  .card b { display: block; margin-bottom: 4px; }
  .meta { color: #888; font-size: .8rem; margin-top: 8px; }
  input { padding: 8px; width: 60%; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 16px; border: none; background: #f6821f; color: #fff; border-radius: 6px; cursor: pointer; }
  a { color: #f6821f; }
</style>
</head>
<body>
<h1>影之刃零攻略站 <small>Cloudflare Workers 全栈 Demo</small></h1>
<p>本页面是静态文件（仓库根目录的 <code>index.html</code>），数据来自同域 Workers API —— 这就是 Cloudflare 全栈项目的形态。</p>

<p>
  <input id="q" placeholder="搜索关键词，如：闪避">
  <button onclick="load()">搜索</button>
</p>

<div id="list">加载中…</div>
<p class="meta" id="server-info"></p>

<p>
  其他页面：<a href="影之刃零攻略调研-20261029.html">攻略调研报告</a> ·
  API：<a href="/api/tips">/api/tips</a> · <a href="/api/server-info">/api/server-info</a>
</p>

<script>
async function load() {
  const q = document.getElementById('q').value;
  const res = await fetch('/api/tips' + (q ? `?q=${encodeURIComponent(q)}` : ''));
  const { data } = await res.json();
  document.getElementById('list').innerHTML = data.length
    ? data.map(t => `<div class="card"><b>${t.title}</b>${t.content}</div>`).join('')
    : '<div class="card">没有匹配结果</div>';
}
load();

fetch('/api/server-info').then(r => r.json()).then(({ data }) => {
  document.getElementById('server-info').textContent =
    ` served by Cloudflare edge node ${data.colo} (${data.region}) · ${data.serverTime}`;
});
</script>
</body>
</html>
